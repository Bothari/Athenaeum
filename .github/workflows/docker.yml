name: Docker

on:
  push:
    # Releases are cut by tagging main; `dogfood` is the throwaway integration
    # branch where in-flight topic branches are merged for testing. Topic branches
    # graduate to main on their own via PR — dogfood is never merged into anything,
    # it is rebuilt (scripts/rebuild-dogfood.sh).
    branches: [dogfood]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for creating the GitHub Release below, not for pushing
      # code — nothing in this workflow commits.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # dogfood branch -> :testing. The only branch this workflow runs on,
            # so a branch ref can only be dogfood.
            type=raw,value=testing,enable=${{ github.ref_type == 'branch' }}
            # v* tag -> :x.y.z and :x.y. metadata-action's default flavor
            # (latest=auto) also tags :latest, but only for a non-prerelease semver
            # tag on a tag ref — so a dogfood push cannot claim it, and a future
            # -rc/-beta tag would not either. Do not add an explicit raw `latest`
            # here: it pushes the tag a second time and overrides that guard.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag publishes an image but does not, on its own, create a GitHub
      # Release — they are separate objects. Without this the Releases page
      # silently stops tracking what is actually deployed: v1.0.1 and v1.0.2
      # shipped as images while the page still advertised v1.0.0 as Latest.
      #
      # Runs only for tags, so a dogfood push cannot create one. generate_release_notes
      # builds the changelog from commits since the previous tag; prerelease is
      # driven by the tag carrying a suffix (v1.2.3-rc.1), matching the image
      # tagging rules above so :latest and "Latest release" agree.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
